<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Xsportgym | Tüm linkler</title>
  <meta name="description" content="Xsportgym: Selen Mışraklı ile online koçluk. Paketler ve iletişim tek sayfada.">
  <meta name="theme-color" content="#f2efe9">
  <meta property="og:title" content="Xsportgym | Tüm linkler">
  <meta property="og:description" content="Selen Mışraklı ile online koçluk: paketler ve iletişim tek sayfada.">
  <meta property="og:image" content="/img/logo-instagram.jpg">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/bas.js"></script>
</head>
<body class="link-govde">
  <main class="link-sayfa">
    <header class="link-profil">
      <div class="link-avatar"><img src="/img/logo-instagram.jpg" alt="Xsportgym logosu" width="168" height="168"></div>
      <h1>Xsportgym</h1>
      <p class="link-alt-yazi"><span lang="en">Online</span> Koçluk · Selen Mışraklı</p>
    </header>

    <!-- Online koçluk seçenekleri paketlerden otomatik gelir (link.js) -->
    <section class="link-kocluk gizli" id="kocluk" aria-labelledby="koclukBaslik">
      <h2 id="koclukBaslik"><span lang="en">Online</span> koçluk</h2>
      <p>Değişime benimle başla</p>
      <div class="link-liste" id="koclukListe"></div>
    </section>

    <nav class="link-liste" aria-label="Bağlantılar" id="linkler">
      <!-- WhatsApp ve telefon butonları, işletme bilgileri doluysa link.js ile buraya eklenir -->
      <a class="link-btn" href="/paketler.html">
        <span class="link-btn__ikon"><i data-ikon="dambil"></i></span>
        <span class="link-btn__yazi"><b>Tüm paketler</b><small>1 ve 3 aylık online koçluk</small></span>
        <i data-ikon="ok-capraz"></i>
      </a>
      <a class="link-btn" href="/">
        <span class="link-btn__ikon"><i data-ikon="yildirim"></i></span>
        <span class="link-btn__yazi"><b>Web sitemiz</b><small>Online koçluğu yakından tanıyın</small></span>
        <i data-ikon="ok-capraz"></i>
      </a>
      <a class="link-btn" href="https://www.instagram.com/selen_msrkli/" target="_blank" rel="noopener">
        <span class="link-btn__ikon"><i data-ikon="instagram"></i></span>
        <span class="link-btn__yazi"><b>Kurucumuz Selen Mışraklı</b><small>@selen_msrkli · Koç, milli sporcu</small></span>
        <i data-ikon="ok-capraz"></i>
      </a>
    </nav>

    <footer class="link-alt">
      <a href="/" class="link-alt__logo" aria-label="Xsportgym ana sayfa"><span class="link-alt__isaret"></span><span>xsport<span>gym</span></span></a>
      <a href="https://www.instagram.com/xsportgymm/" target="_blank" rel="noopener" class="link-alt__insta"><i data-ikon="instagram"></i> @xsportgymm</a>
    </footer>
  </main>

  <script src="/js/ikonlar.js"></script>
  <script src="/js/link.js"></script>
</body>
</html>
