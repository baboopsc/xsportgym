<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paketler | Xsportgym</title>
  <meta name="description" content="Xsportgym üyelik ve personal training paketleri. iyzico ile güvenli online ödeme.">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/bas.js"></script>
</head>
<body>
  <header id="ust"></header>

  <main>
    <section class="sayfa-basi" aria-labelledby="katalogBaslik">
      <div class="sayfa-basi__kart">
        <div class="sayfa-basi__arka"><div class="gorsel-yeri" data-yer="katalog" data-oncelik></div></div>
        <nav class="yol" aria-label="Konum"><a href="/">Ana Sayfa</a><i data-ikon="sag"></i><span>Paketler</span></nav>
        <h1 id="katalogBaslik">Üyelik <span class="hafif">ve PT paketleri</span></h1>
        <p>Aylık üyelikten birebir personal training'e kadar tüm paketlerimiz. Bir pakete tıklayarak ayrıntılarını görebilirsin.</p>
        <div class="sayilar">
          <div class="sayi-kart"><strong data-sayi="cesit">—</strong><span>paket</span></div>
          <div class="sayi-kart"><strong>6 gün</strong><span>haftada açık</span></div>
          <div class="sayi-kart"><strong>3D</strong><span>Secure ile güvenli ödeme</span></div>
        </div>
      </div>
    </section>

    <section class="kap bolum yakin" id="ara" aria-labelledby="araBaslik">
      <div class="katalog-arac">
        <div class="bolum-basi">
          <p class="ust-baslik">Xsportgym</p>
          <h2 id="araBaslik">Sana uygun paketi seç</h2>
          <div class="arac-sag bolum-basi__sag">
            <label class="arama-kutu" for="araKutusu"><span class="ekran-okuyucu">Paket ara</span><i data-ikon="arama"></i>
              <input id="araKutusu" type="search" placeholder="Paket adı veya türü" autocomplete="off"></label>
            <label for="sirala" class="ekran-okuyucu">Sırala</label>
            <select id="sirala">
              <option value="">Önerilen</option>
              <option value="artan">Fiyat: düşükten yükseğe</option>
              <option value="azalan">Fiyat: yüksekten düşüğe</option>
              <option value="ad">Ada göre (A–Z)</option>
            </select>
          </div>
        </div>
        <div class="cipler" id="kategoriler" role="group" aria-label="Kategoriye göre süz"></div>
      </div>
      <p class="sonuc-sayisi" id="sonucSayisi" aria-live="polite"></p>
      <div class="urun-izgara" id="urunler"></div>
    </section>
  </main>

  <footer id="alt"></footer>
  <script src="/js/ikonlar.js"></script>
  <script src="/js/gorseller.js"></script>
  <script src="/js/ortak.js"></script>
  <script src="/js/katalog.js"></script>
</body>
</html>
